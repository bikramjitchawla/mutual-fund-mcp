[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mutual-fund-mcp"
version = "0.1.0"
description = "Stateless MCP server for Indian mutual fund NAV data and analytics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "fastmcp>=2.0,<3.0",
  "httpx>=0.27,<1.0",
]

[project.scripts]
mutual-fund-mcp = "mutual_fund_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["mutual_fund_mcp", "clients", "models", "services"]
